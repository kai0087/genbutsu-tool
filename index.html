<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>現物表示マス編集（スマホ最適UI）</title>
<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  color: #111;
  background: #222;
  font-size: 14px;
  --accent: #0066cc;
  --danger: #ff8a80;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #242426;
  color: #fff;
  overflow: hidden;
}
html, body { touch-action: pan-x pan-y; }
.stage-wrap, .stage-wrap * { touch-action: none; }
body {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
}

/* 上部ヘッダー */
header {
  height: 46px;
  min-height: 46px;
  background: #18181b;
  color: #fff;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
  z-index: 50;
}
header strong { font-size: 14px; white-space: nowrap; }
.header-tools {
  display: flex;
  align-items: center;
  gap: 6px;
}
button, select, input { font: inherit; }
button {
  padding: 6px 10px;
  border: 1px solid #666;
  background: #2e2e32;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}
button:active { background: #444; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { background: rgba(217, 48, 37, 0.25); border-color: rgba(255, 138, 128, 0.4); color: var(--danger); }
select, input[type=number], input[type=text] {
  padding: 8px 10px;
  border: 1px solid #888;
  border-radius: 6px;
  max-width: 100%;
  background: #fff;
  color: #111;
}

/* ステージ領域：用紙が小さい時は中央、大きい時は左上からスクロール可能 */
.stage-area {
  flex: 1 1 0;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
}
.stage-wrap {
  flex: 1 1 0;
  min-height: 0;
  position: relative;
  overflow: auto;
  padding: 28px 16px 16px;
  background: #3a3a3e;
  display: flex;
  -webkit-overflow-scrolling: touch;
}
.stage-sizer {
  position: relative;
  flex: 0 0 auto;
  margin: auto;
}
.stage {
  position: absolute;
  left: 0; top: 0;
  background: #ffffff;
  color: #111;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  transform-origin: 0 0;
}
.paper-label {
  position: absolute;
  top: 6px;
  left: 10px;
  z-index: 5;
  color: #e5e7eb;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
}
#errorBanner {
  position: fixed;
  left: 8px; right: 8px; bottom: 62px;
  z-index: 2000;
  background: #b3261e;
  color: #fff;
  font-size: 12px;
  padding: 8px 10px;
  border-radius: 8px;
  white-space: pre-wrap;
  word-break: break-all;
}
#errorBanner[hidden] { display: none; }
#updateBanner { position: fixed; left: 8px; right: 8px; top: 54px; z-index: 2000; background: #1f6feb; color: #fff; font-size: 13px; font-weight: 700; text-align: center; padding: 10px; border-radius: 8px; }
#updateBanner[hidden] { display: none; }

/* 用紙ヘッダー */
.sheet-header {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 10%;
  border-bottom: 1px solid #111;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 5px;
  padding: 1.5mm 2.5mm;
  font-size: 12px;
  font-weight: 700;
  background: #fff;
  z-index: 5;
  flex-wrap: nowrap;
  white-space: nowrap;
  overflow: hidden;
}
.sheet-header .sheet-title { font-size: 14px; font-weight: 800; white-space: nowrap; }
.sheet-header .sheet-title input { width: 43mm; font-weight: 800; font-size: 14px; }
.sheet-header label { display: flex; align-items: center; gap: 3px; white-space: nowrap; flex: 0 0 auto; font-size: 11px; font-weight: 700; }
.sheet-header input { width: 29mm; min-width: 0; border: 1px solid #777; padding: 2px; font-size: 11px; font-weight: 600; background: transparent; }

#paper { position: absolute; inset: 0; overflow: hidden; }
.grid-bg {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(to right, #ddd 1px, transparent 1px),
                    linear-gradient(to bottom, #ddd 1px, transparent 1px);
  background-size: 10px 10px;
}

/* マス（セル）とレイヤー順 */
.cell {
  position: absolute;
  background: #fff;
  min-width: 5px;
  min-height: 5px;
  user-select: none;
  touch-action: none;
}
.cell.text-image {
  border: none !important;
  background: transparent !important;
}
.cell.selected {
  outline: 2.5px solid var(--accent);
  outline-offset: 1px;
}
.border-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 44; }
.cell.parent { background: #fff; z-index: 1 !important; }
.cell.child { z-index: 20 !important; }
.cell.image-object { z-index: 30 !important; }
.cell.text-image { z-index: 40 !important; }
.cell.parent.selected { z-index: 1 !important; }
.cell.child.selected { z-index: 25 !important; }
.cell.image-object.selected { z-index: 35 !important; }
.cell.text-image.selected { z-index: 45 !important; }

.cell-content {
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2px;
  white-space: pre-wrap;
  word-break: break-word;
  pointer-events: none;
}
.cell-content img { width: 100%; height: 100%; object-fit: contain; }

/* スマホ指操作用の四隅（4点）大きめ丸型ハンドル */
.cell .handle {
  position: absolute;
  width: 18px;
  height: 18px;
  background: var(--accent);
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
  z-index: 50;
  touch-action: none;
}
.handle.nw { left: -9px; top: -9px; }
.handle.ne { right: -9px; top: -9px; }
.handle.sw { left: -9px; bottom: -9px; }
.handle.se { right: -9px; bottom: -9px; }

/* 選択マスの種類に応じたコンテキスト・ポップアップ */
.context-popup {
  position: fixed;
  z-index: 400;
  background: rgba(24, 24, 28, 0.96);
  backdrop-filter: blur(8px);
  border: 1px solid #555;
  border-radius: 12px;
  padding: 6px;
  display: flex;
  align-items: center;
  gap: 5px;
  max-width: calc(100vw - 16px);
  overflow-x: auto;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
  scrollbar-width: none;
}
.context-popup::-webkit-scrollbar { display: none; }
.context-popup[hidden] { display: none; }
.context-popup .badge {
  font-size: 10px;
  color: #93c5fd;
  font-weight: 700;
  padding: 0 6px 0 2px;
  border-right: 1px solid #444;
  white-space: nowrap;
}
.context-popup button {
  padding: 7px 10px;
  font-size: 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* 下部固定アクションバー */
.bottom-bar {
  height: 54px;
  min-height: 54px;
  background: #18181b;
  border-top: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 6px;
  gap: 5px;
  flex-shrink: 0;
  z-index: 60;
}
.bottom-bar button {
  flex: 1;
  height: 40px;
  font-size: 12px;
  padding: 4px 6px;
  white-space: nowrap;
}

/* ボトムシート＆ダイアログ */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet-backdrop.center-dialog {
  align-items: center;
  padding: 15px;
}
.sheet-backdrop[hidden] { display: none; }
.bottom-sheet {
  width: 100%;
  max-width: 500px;
  background: #fff;
  color: #111;
  border-radius: 16px 16px 0 0;
  padding: 16px 18px 24px;
  max-height: 82dvh;
  overflow-y: auto;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.35);
}
.center-dialog .bottom-sheet {
  border-radius: 14px;
  max-width: 360px;
  padding: 16px;
}
.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #e5e7eb;
}
.sheet-head h3 { margin: 0; font-size: 15px; color: #111; }
.sheet-close {
  background: #e5e7eb;
  color: #111;
  border: none;
  border-radius: 16px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 700;
}
.field { margin-bottom: 11px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: #333; margin-bottom: 4px; }
.field input[type=text], .field input[type=number], .field select { width: 100%; }
.field input[type=color] { width: 100%; height: 38px; border: 1px solid #ccc; border-radius: 6px; padding: 2px; background: #fff; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.sheet-actions button { color: #111; background: #f3f4f6; border-color: #bbb; }
.sheet-actions button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
small.help { display: block; color: #555; font-size: 11px; line-height: 1.45; margin-top: 4px; }

/* カラー設定メニュー */
.color-options { display: grid; gap: 8px; }
.color-opt { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 16px; font-weight: 700; text-align: left; }
.color-opt::before { content: ""; width: 28px; height: 28px; border-radius: 6px; border: 1px solid #888; background: var(--c); flex: 0 0 auto; }
.color-opt[aria-pressed="true"] { outline: 3px solid #1f6feb; }
.cell.parent.free { z-index: 10 !important; }
.cell.parent.free.selected { z-index: 10 !important; }

/* 印刷時 */
@media print {
  #stage, #paper { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { height: auto !important; overflow: visible !important; background: #fff !important; color: #111 !important; display: block !important; position: static !important; }
  .stage-area { display: block !important; position: static !important; }
  .stage-sizer { position: static !important; margin: 0 !important; }
  .stage { position: relative !important; left: 0 !important; top: 0 !important; }
  #errorBanner { display: none !important; }
  header, .bottom-bar, .context-popup, .sheet-backdrop, .paper-label, .grid-bg, .handle { display: none !important; }
  .stage-wrap, .stage-sizer { padding: 0 !important; overflow: visible !important; background: #fff !important; display: block !important; width: auto !important; height: auto !important; }
  .stage { margin: 0 !important; box-shadow: none !important; transform: none !important; }
  .cell.selected { outline: none !important; }
  .cell.text-image { border: none !important; outline: none !important; background: transparent !important; box-shadow: none !important; }
}
</style>
</head>
<body>

<header>
  <strong>現物表示マス編集</strong>
  <div class="header-tools">
    <button type="button" id="resetZoom">全体表示</button>
    <button type="button" id="openSettings">用紙・設定</button>
    <button type="button" class="primary" id="print">印刷</button>
  </div>
</header>

<div class="stage-area">
<div class="paper-label" id="paperLabel"></div>
<section class="stage-wrap" id="stageWrap">
  <div class="stage-sizer" id="stageSizer">
    <div class="stage" id="stage">
      <div id="paper">
        <div class="sheet-header" id="sheetHeader">
          <label class="sheet-title"><input id="sheetTitle" type="text" value="車型別部品表示票" aria-label="表示票タイトル"></label>
          <label>工程名 <input id="processName" type="text" placeholder="工程名"></label>
          <label>E/G型式 <input id="engineType" type="text" placeholder="E/G型式"></label>
          <label>T/T <input id="ttValue" type="text" placeholder="T/T"></label>
          <label>作成日 <input id="createdDate" type="date"></label>
        </div>
        <div class="grid-bg" id="gridBg" hidden></div>
        <svg class="border-layer" id="borderLayer" aria-hidden="true"><path id="borderPath" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="miter"/></svg>
      </div>
    </div>
  </div>
</section>
</div>
<div id="errorBanner" hidden></div>
<div id="updateBanner" hidden onclick="location.reload()">新しいバージョンがあります。ここをタップして更新</div>

<!-- 選択マスの種類に応じて切り替わるフローティング・ポップアップ -->
<div id="contextPopup" class="context-popup" hidden></div>

<!-- 下部固定ツールバー -->
<nav class="bottom-bar">
  <button type="button" class="primary" id="addParent">＋ 親マス</button>
  <button type="button" id="addFree">＋ フリーマス</button>
  <button type="button" id="colorSetting">カラー設定</button>
  <input id="imageFile" type="file" accept="image/*" hidden>
</nav>

<!-- 親マス構成選択 -->
<div id="parentFormatDialog" class="sheet-backdrop center-dialog" hidden>
  <div class="bottom-sheet">
    <div class="sheet-head">
      <h3>親マスの部品構成</h3>
      <button type="button" class="sheet-close" data-close="parentFormatDialog">閉じる</button>
    </div>
    <div class="field">
      <label for="parentFormat">フォーマット</label>
      <select id="parentFormat">
        <option value="single">部品単品</option>
        <option value="assembly">部品＋ボルト・ナット（構成品）</option>
      </select>
    </div>
    <div class="sheet-actions">
      <button type="button" id="cancelParent">キャンセル</button>
      <button type="button" class="primary" id="confirmParent">追加</button>
    </div>
  </div>
</div>

<!-- カラー設定（印刷時の余白の色） -->
<div id="colorDialog" class="sheet-backdrop center-dialog" hidden>
  <div class="bottom-sheet">
    <div class="sheet-head">
      <h3>カラー設定（余白の色）</h3>
      <button type="button" class="sheet-close" data-close="colorDialog">閉じる</button>
    </div>
    <div class="color-options" id="colorOptions">
      <button type="button" class="color-opt" data-color="L4" style="--c:#4caf50">L4　緑</button>
      <button type="button" class="color-opt" data-color="V6" style="--c:#3b82f6">V6　青</button>
      <button type="button" class="color-opt" data-color="GD" style="--c:#e5484d">GD　赤</button>
      <button type="button" class="color-opt" data-color="none" style="--c:#ffffff">なし（白）</button>
    </div>
  </div>
</div>

<!-- 文字画像作成・編集 -->
<div id="textImageDialog" class="sheet-backdrop center-dialog" hidden>
  <div class="bottom-sheet">
    <div class="sheet-head">
      <h3 id="textImageTitle">文字画像の作成</h3>
      <button type="button" class="sheet-close" data-close="textImageDialog">閉じる</button>
    </div>
    <div class="field"><label for="textImageValue">表示する文字</label><input id="textImageValue" type="text"></div>
    <div class="row">
      <div class="field"><label for="textImageColor">文字色</label><input id="textImageColor" type="color" value="#111111"></div>
      <div class="field"><label for="textImageSize">文字サイズ（px）</label><input id="textImageSize" type="number" min="8" max="120" value="22"></div>
    </div>
    <div class="field"><label><input id="textImageClearBg" type="checkbox" checked> 背景色をクリア（透明）</label></div>
    <div class="field" id="textImageBgField" hidden><label for="textImageBg">背景色</label><input id="textImageBg" type="color" value="#ffffff"></div>
    <div class="sheet-actions">
      <button type="button" id="cancelTextImage">キャンセル</button>
      <button type="button" class="primary" id="confirmTextImage">挿入</button>
    </div>
  </div>
</div>

<!-- 選択マスの詳細編集ボトムシート -->
<div id="editSheet" class="sheet-backdrop" hidden>
  <div class="bottom-sheet">
    <div class="sheet-head">
      <h3 id="editSheetTitle">選択中のマスを編集</h3>
      <button type="button" class="sheet-close" data-close="editSheet">完了</button>
    </div>
    <div class="field"><label for="kindLabel">種類</label><input id="kindLabel" type="text" readonly></div>
    <div class="row">
      <div class="field"><label for="w">幅 (mm)</label><input id="w" type="number" min="5"></div>
      <div class="field"><label for="h">高さ (mm)</label><input id="h" type="number" min="5"></div>
    </div>
    <div class="field" id="textFieldWrap"><label for="cellText">表示文字</label><input id="cellText" type="text" value=""></div>
    <div class="row">
      <div class="field"><label for="bg">背景色</label><input id="bg" type="color" value="#ffffff"></div>
      <div class="field"><label for="textColor">文字色</label><input id="textColor" type="color" value="#111111"></div>
    </div>
    <div class="field" id="imageRotateControls" hidden>
      <label>画像の回転</label>
      <div class="row">
        <button type="button" id="rotateLeft" style="color:#111;background:#f3f4f6;border-color:#bbb;">左へ90°</button>
        <button type="button" id="rotateRight" style="color:#111;background:#f3f4f6;border-color:#bbb;">右へ90°</button>
      </div>
    </div>
    <div class="field" id="fontSizeFieldWrap"><label for="fontSize">文字サイズ（px）</label><input id="fontSize" type="number" min="8" max="120" value="28"></div>
    <div class="field"><label><input id="lockRatio" type="checkbox"> 縦横比を固定（写真用）</label></div>
    <small class="help">幅・高さはmm相当の編集単位です。入力すると即時反映します。</small>
  </div>
</div>

<!-- 用紙・グリッド設定ボトムシート -->
<div id="settingsSheet" class="sheet-backdrop" hidden>
  <div class="bottom-sheet">
    <div class="sheet-head">
      <h3>用紙・グリッド設定</h3>
      <button type="button" class="sheet-close" data-close="settingsSheet">閉じる</button>
    </div>
    <div class="row">
      <div class="field">
        <label for="paperSize">用紙</label>
        <select id="paperSize"><option value="A4">A4</option><option value="B5">B5</option></select>
      </div>
      <div class="field">
        <label for="orientation">向き</label>
        <select id="orientation"><option value="landscape" selected>横</option><option value="portrait">縦</option></select>
      </div>
    </div>
    <div class="field"><label><input id="gridToggle" type="checkbox" checked> グリッド吸着（5mm）</label></div>
    <div class="field"><label><input id="gridView" type="checkbox"> 補助線表示</label></div>
    <div class="field"><label><input id="fitPrint" type="checkbox" checked> 1枚に収める</label></div>
    <small class="help" id="status">準備完了。親マスを追加し、必要な子マスを配置してください。</small>
  </div>
</div>

<script>
(() => {
 const $ = id => document.getElementById(id);
 /* どこかで例外が出たら画面下に赤帯で表示（原因が分かるように） */
 function showError(msg) {
  const b = document.getElementById('errorBanner');
  if (!b) return;
  b.hidden = false;
  b.textContent = 'エラー: ' + msg;
 }
 window.addEventListener('error', e => showError((e.message || '不明') + (e.lineno ? ' (行' + e.lineno + ')' : '')));
 window.addEventListener('unhandledrejection', e => showError(String(e.reason)));
 const paper = $('paper'), stage = $('stage'), stageSizer = $('stageSizer'), stageWrap = $('stageWrap'), gridBg = $('gridBg'), popup = $('contextPopup');
 const mm = 3.78;
 const sizes = { A4: [210, 297], B5: [182, 257] };
 let cells = [], selected = null, nextId = 1, drag = null, textImageEditId = null, currentScale = 1, focusedParentId = null, cellTouchedAt = 0;
 const fields = ['w', 'h', 'bg', 'fontSize', 'lockRatio', 'cellText', 'textColor'];
 const get = id => $(id).value;
 const set = (id, v) => $(id).value = v;
 const selectedCell = () => cells.find(c => c.id === selected);

 /* 操作対象の親マス：親マス選択中ならそれ自身、子マス・画像選択中ならその持ち主の親 */
 const targetParent = () => {
  const c = selectedCell();
  if (!c) return null;
  if (c.kind === 'parent') return c;
  return c.parentId ? (cells.find(p => p.id === c.parentId) || null) : null;
 };

 /* 全マスの枠線を1本のパスにまとめて描く（重なっても・隣り合っても1本線になる） */
 function drawBorders() {
  let d = '';
  for (const c of cells) {
   if (c.type === 'textImage') continue;
   const p = c.parentId ? cells.find(q => q.id === c.parentId) : null;
   const x = (c.x + (p ? p.x : 0)) * mm, y = (c.y + (p ? p.y : 0)) * mm;
   const w = c.w * mm, h = c.h * mm;
   d += 'M' + x + ' ' + y + 'h' + w + 'v' + h + 'h' + (-w) + 'z';
  }
  const path = document.getElementById('borderPath');
  if (path) path.setAttribute('d', d);
 }

 function dims() {
  let [w, h] = sizes[get('paperSize')] || sizes.A4;
  if (get('orientation') === 'landscape') [w, h] = [h, w];
  return [w, h];
 }

 function stagePixelDims() {
  const [w, h] = dims();
  return { rawW: Math.max(100, w * mm), rawH: Math.max(100, h * mm) };
 }

 function boardBounds() {
  const [pw, ph] = dims();
  return { x: 0, y: ph * 0.10, w: pw, h: ph * 0.90 };
 }

 /* 縦・横どちらの用紙でも等間隔の定位置グリッドを算出（横: 3列×2行 / 縦: 2列×3行） */
 function getParentGridSlot(slotIndex) {
  const board = boardBounds();
  const isLandscape = get('orientation') === 'landscape';
  const cols = isLandscape ? 3 : 2;
  const rows = isLandscape ? 2 : 3;
  const gapX = 5;
  const gapY = 5;
  const floor5 = v => Math.floor(v / 5) * 5;
  const cellW = Math.max(20, floor5((board.w - gapX * (cols + 1)) / cols));
  const cellH = Math.max(20, floor5((board.h - gapY * (rows + 1)) / rows));
  const offsetX = (board.w - (cols * cellW + gapX * (cols - 1))) / 2;
  const offsetY = (board.h - (rows * cellH + gapY * (rows - 1))) / 2;

  const pageCapacity = cols * rows;
  const localIdx = slotIndex % pageCapacity;
  const pageOffset = Math.floor(slotIndex / pageCapacity) * 3;
  const col = localIdx % cols;
  const row = Math.floor(localIdx / cols);

  const x = Math.round((board.x + offsetX + col * (cellW + gapX) + pageOffset) * 10) / 10;
  const y = Math.round((board.y + offsetY + row * (cellH + gapY) + pageOffset) * 10) / 10;
  return { x, y, w: cellW, h: cellH };
 }

 function relayoutParentsToGrid() {
  const parents = cells.filter(c => c.kind === 'parent' && !c.free);
  parents.forEach((p, idx) => {
   const oldW = p.w || 1;
   const oldH = p.h || 1;
   const slot = getParentGridSlot(idx);
   const scaleX = slot.w / oldW;
   const scaleY = slot.h / oldH;

   p.slotIndex = idx;
   p.x = slot.x;
   p.y = slot.y;
   p.w = slot.w;
   p.h = slot.h;

   descendants(p.id).forEach(ch => {
    ch.x = Math.round(ch.x * scaleX * 10) / 10;
    ch.y = Math.round(ch.y * scaleY * 10) / 10;
    ch.w = Math.max(5, Math.round(ch.w * scaleX * 10) / 10);
    ch.h = Math.max(5, Math.round(ch.h * scaleY * 10) / 10);
    ch.x = Math.max(0, Math.min(ch.x, p.w - ch.w));
    ch.y = Math.max(0, Math.min(ch.y, p.h - ch.h));
   });
  });
 }

 function applyScale(scale, centerTarget = null) {
  const { rawW, rawH } = stagePixelDims();
  stage.style.width = rawW + 'px';
  stage.style.height = rawH + 'px';

  const safeScale = Number.isFinite(scale) && scale > 0 ? Math.max(0.1, Math.min(3, scale)) : 0.5;
  currentScale = safeScale;

  const scaledW = rawW * currentScale;
  const scaledH = rawH * currentScale;
  stageSizer.style.width = scaledW + 'px';
  stageSizer.style.height = scaledH + 'px';
  stage.style.transform = 'scale(' + currentScale + ')';
  stage.style.margin = '0';

  requestAnimationFrame(() => {
   if (centerTarget) {
    const cx = (centerTarget.x + centerTarget.w / 2) * mm * currentScale;
    const cy = (centerTarget.y + centerTarget.h / 2) * mm * currentScale;
    stageWrap.scrollLeft = Math.max(0, stageSizer.offsetLeft + cx - stageWrap.clientWidth / 2);
    stageWrap.scrollTop = Math.max(0, stageSizer.offsetTop + cy - stageWrap.clientHeight / 2);
   } else {
    stageWrap.scrollLeft = 0;
    stageWrap.scrollTop = 0;
   }
   positionPopup();
  });
 }

 /* 表示領域のサイズ。レイアウト未確定で0や極小が返ったら画面サイズで代用 */
 function wrapSize() {
  let w = stageWrap.clientWidth, h = stageWrap.clientHeight;
  if (!(w >= 120)) w = window.innerWidth || 390;
  if (!(h >= 120)) h = (window.innerHeight || 700) - 100;
  return { w, h };
 }

 function fitStage() {
  focusedParentId = null;
  const { rawW, rawH } = stagePixelDims();
  const { w: wrapW, h: wrapH } = wrapSize();
  const scaleW = (wrapW - 32) / rawW;
  const scaleH = (wrapH - 44) / rawH;
  const s = Math.max(0.1, Math.min(1, scaleW, scaleH));
  applyScale(s, null);
 }

 function focusParentCell(parentCell) {
  if (!parentCell || parentCell.kind !== 'parent') return;
  focusedParentId = parentCell.id;
  const { w: wrapW, h: wrapH } = wrapSize();
  const availW = Math.max(120, wrapW - 36);
  const availH = Math.max(120, wrapH - 130);
  const cellW = Math.max(20, parentCell.w * mm);
  const cellH = Math.max(20, parentCell.h * mm);
  const s = Math.max(0.35, Math.min(2.5, availW / cellW, availH / cellH));
  applyScale(s, parentCell);
 }

 function paperSetup() {
  const [w, h] = dims();
  const { rawW, rawH } = stagePixelDims();
  stage.style.width = rawW + 'px';
  stage.style.height = rawH + 'px';
  $('paperLabel').textContent = `${get('paperSize')}・${get('orientation') === 'portrait' ? '縦' : '横'}（${w}×${h}mm）`;
  $('sheetHeader').style.height = '10%';
  relayoutParentsToGrid();
  cells.filter(c => c.free).forEach(c => {
   c.x = Math.max(0, Math.min(c.x, w - c.w));
   c.y = Math.max(0, Math.min(c.y, h - c.h));
  });
  render();
  fitStage();
 }

 function snap(v) { return $('gridToggle').checked ? Math.round(v / 5) * 5 : v; }

 function findEmptySpotInParent(parent, w, h) {
  const cw = Math.min(w, parent.w);
  const ch = Math.min(h, parent.h);
  const maxX = Math.max(0, parent.w - cw);
  const maxY = Math.max(0, parent.h - ch);
  const step = $('gridToggle').checked ? 5 : 2.5;
  const siblings = cells.filter(c => c.parentId === parent.id);

  const overlaps = (x, y) => siblings.some(s =>
   x < s.x + s.w && x + cw > s.x && y < s.y + s.h && y + ch > s.y
  );

  for (let y = 0; y <= maxY + 0.001; y += step) {
   for (let x = 0; x <= maxX + 0.001; x += step) {
    const rx = Math.min(maxX, Math.round(x * 10) / 10);
    const ry = Math.min(maxY, Math.round(y * 10) / 10);
    if (!overlaps(rx, ry)) {
     return { x: rx, y: ry, w: cw, h: ch };
    }
   }
  }
  return { x: 0, y: 0, w: cw, h: ch };
 }

 function nextAvailableParentSlotIndex() {
  const used = new Set(cells.filter(c => c.kind === 'parent' && !c.free && typeof c.slotIndex === 'number').map(c => c.slotIndex));
  let idx = 0;
  while (used.has(idx)) idx++;
  return idx;
 }

 function addCell(kind, parentId = null) {
  const c = {
   id: nextId++, kind, parentId,
   x: 5, y: 5, w: 20, h: 15,
   text: kind === 'parent' ? '親マス' : '子マス',
   type: 'text', bg: '#ffffff', textColor: '#111111', fontSize: kind === 'child' ? 28 : 20
  };
  if (kind === 'parent') {
   const slotIdx = nextAvailableParentSlotIndex();
   const slot = getParentGridSlot(slotIdx);
   c.slotIndex = slotIdx;
   c.x = slot.x; c.y = slot.y; c.w = slot.w; c.h = slot.h;
  }
  if (parentId) {
   const p = cells.find(x => x.id === parentId);
   if (!p) return null;
   const spot = findEmptySpotInParent(p, c.w, c.h);
   c.x = spot.x; c.y = spot.y; c.w = spot.w; c.h = spot.h;
  }
  cells.push(c);
  selected = c.id;
  render();
  syncPanel();
  if (kind === 'parent') focusParentCell(c);
  return c;
 }

 function addParentTemplate(format) {
  const parent = addCell('parent');
  if (!parent) return;
  parent.format = format;
  const childH = Math.min(15, Math.max(8, Math.round(parent.h * 0.22 * 10) / 10));
  const specs = format === 'assembly'
   ? [
      { x: 0, w: Math.round(parent.w * (2 / 9) * 10) / 10 },
      { x: Math.round(parent.w * (2 / 9) * 10) / 10, w: Math.round(parent.w * (2 / 9) * 10) / 10 },
      { x: Math.round(parent.w * (4 / 9) * 10) / 10, w: Math.round(parent.w * (3 / 9) * 10) / 10 },
      { x: Math.round(parent.w * (7 / 9) * 10) / 10, w: Math.max(5, Math.round((parent.w - parent.w * (7 / 9)) * 10) / 10) }
     ]
   : [
      { x: 0, w: Math.round(parent.w * (2 / 9) * 10) / 10 },
      { x: Math.round(parent.w * (2 / 9) * 10) / 10, w: Math.round(parent.w * (2 / 9) * 10) / 10 }
     ];
  specs.forEach(spec => cells.push({
   id: nextId++, kind: 'child', parentId: parent.id,
   x: spec.x, y: 0, w: spec.w, h: childH,
   text: '子マス', type: 'text', bg: '#ffffff', textColor: '#111111', fontSize: 28
  }));
  selected = parent.id;
  render();
  syncPanel();
  focusParentCell(parent);
 }

 /* ---- カラー設定：用紙の余白（マスの外側）の色 ---- */
 const PAPER_COLORS = {
  L4: '#4caf50',   /* 緑 */
  V6: '#3b82f6',   /* 青 */
  GD: '#e5484d',   /* 赤 */
  none: '#ffffff'  /* 白（色なし） */
 };
 let paperColorKey = 'none';
 function applyPaperColor() {
  const col = PAPER_COLORS[paperColorKey] || '#ffffff';
  paper.style.background = col;
  stage.style.background = col;
  document.querySelectorAll('.color-opt').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.color === paperColorKey)));
 }

 /* ---- フリーマス：用紙のどこにでも置ける・大きさも自由な枠。中に子マス・画像・文字画像を自由に配置 ---- */
 function addFreeCell() {
  const [pw, ph] = dims();
  const n = cells.filter(c => c.free).length;
  const w = Math.min(60, pw), h = Math.min(40, ph * 0.9);
  const c = {
   id: nextId++, kind: 'parent', free: true, parentId: null, format: 'free',
   x: Math.round(Math.min(5 + n * 5, Math.max(0, pw - w)) * 10) / 10,
   y: Math.round(Math.min(ph * 0.10 + 5 + n * 5, Math.max(0, ph - h)) * 10) / 10,
   w, h, text: '', type: 'text', bg: '#ffffff', textColor: '#111111', fontSize: 28
  };
  cells.push(c);
  selected = c.id;
  render();
  syncPanel();
  focusParentCell(c);
 }

 function descendants(id) { return cells.filter(c => c.parentId === id); }

 function makeTextImage(text, color, size, clearBg = true, bg = '#ffffff') {
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = `bold ${size}px sans-serif`;
  const width = Math.max(20, Math.ceil(measure.measureText(text).width + 24));
  const height = Math.max(30, Math.ceil(size * 1.8));
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  if (!clearBg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height); }
  ctx.font = `bold ${size}px sans-serif`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  let x = 12;
  for (const ch of text) {
   const cw = ctx.measureText(ch).width;
   if (ch === '□') { const side = size * .68; ctx.fillRect(x + (cw - side) / 2, (height - side) / 2, side, side); }
   else if (ch === '○') { const r = size * .36; ctx.beginPath(); ctx.arc(x + cw / 2, height / 2, r, 0, Math.PI * 2); ctx.fill(); }
   else { ctx.fillText(ch, x, height / 2); }
   x += cw;
  }
  return canvas.toDataURL('image/png');
 }

 function updateContextPopup() {
  const c = selectedCell();
  if (!c || drag) {
   popup.hidden = true;
   return;
  }
  let html = '';
  if (c.kind === 'parent') {
   html = `
    <span class="badge">${c.free ? 'フリーマス' : '親マス'}</span>
    ${c.free ? '<button type="button" data-act="zoom">ズーム</button>' : ''}
    <button type="button" class="primary" data-act="addChild">＋子マス</button>
    <button type="button" data-act="addImg">＋画像</button>
    <button type="button" data-act="addTxtImg">＋文字画像</button>
    <button type="button" data-act="edit">編集</button>
    <button type="button" data-act="dup">複製</button>
    <button type="button" class="danger" data-act="del">削除</button>
   `;
  } else if (c.kind === 'child') {
   html = `
    <span class="badge">子マス</span>
    <button type="button" data-act="toParent">↑親マス</button>
    <button type="button" class="primary" data-act="edit">文字・サイズ編集</button>
    <button type="button" data-act="dup">複製</button>
    <button type="button" class="danger" data-act="del">削除</button>
   `;
  } else {
   const isTextImg = c.type === 'textImage';
   html = `
    <span class="badge">${isTextImg ? '文字画像' : '画像'}</span>
    <button type="button" data-act="toParent">↑親マス</button>
    ${isTextImg
      ? `<button type="button" class="primary" data-act="editTextImg">文言・色編集</button>`
      : `<button type="button" data-act="rotL">↺90°</button><button type="button" data-act="rotR">↻90°</button>`}
    <button type="button" data-act="edit">サイズ・色編集</button>
    <button type="button" data-act="dup">複製</button>
    <button type="button" class="danger" data-act="del">削除</button>
   `;
  }
  popup.innerHTML = html;
  popup.hidden = false;
  positionPopup();
 }

 function positionPopup() {
  const c = selectedCell();
  if (!c || popup.hidden) return;
  const el = paper.querySelector(`.cell[data-id="${c.id}"]`);
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const popRect = popup.getBoundingClientRect();
  const margin = 8;
  const topLimit = 54;
  const bottomLimit = window.innerHeight - 64;

  let left = rect.left + rect.width / 2 - popRect.width / 2;
  left = Math.max(margin, Math.min(window.innerWidth - popRect.width - margin, left));

  let top = rect.top - popRect.height - margin;
  if (top < topLimit) {
   top = rect.bottom + margin;
  }
  if (top + popRect.height > bottomLimit) {
   top = Math.max(topLimit, Math.min(bottomLimit - popRect.height, topLimit));
  }

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
 }

 popup.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const c = selectedCell();
  if (!c) return;
  const act = btn.dataset.act;

  const tp = targetParent();
  if (act === 'toParent') { if (tp) { selected = tp.id; render(); syncPanel(); focusParentCell(tp); } }
  else if (act === 'zoom') { if (tp) focusParentCell(tp); }
  else if (act === 'addChild') { if (tp) addCell('child', tp.id); }
  else if (act === 'addImg') $('imageFile').click();
  else if (act === 'addTxtImg') openTextImageDialog();
  else if (act === 'editTextImg') openTextImageDialog(c);
  else if (act === 'edit') { syncPanel(); $('editSheet').hidden = false; }
  else if (act === 'rotL') rotateSelectedImage(-90);
  else if (act === 'rotR') rotateSelectedImage(90);
  else if (act === 'dup') {
   if (c.kind === 'parent' && c.free) {
    const copy = { ...c, id: nextId++, x: c.x + 5, y: c.y + 5 };
    cells.push(copy);
    descendants(c.id).forEach(ch => cells.push({ ...ch, id: nextId++, parentId: copy.id }));
    selected = copy.id;
    render();
    syncPanel();
    focusParentCell(copy);
   } else if (c.kind === 'parent') {
    const slotIdx = nextAvailableParentSlotIndex();
    const slot = getParentGridSlot(slotIdx);
    const copy = { ...c, id: nextId++, slotIndex: slotIdx, x: slot.x, y: slot.y, w: slot.w, h: slot.h };
    cells.push(copy);
    descendants(c.id).forEach(ch => cells.push({ ...ch, id: nextId++, parentId: copy.id }));
    selected = copy.id;
    render();
    syncPanel();
    focusParentCell(copy);
   } else {
    const parent = c.parentId ? cells.find(p => p.id === c.parentId) : null;
    const spot = parent ? findEmptySpotInParent(parent, c.w, c.h) : { x: c.x + 10, y: c.y + 10, w: c.w, h: c.h };
    const copy = { ...c, id: nextId++, x: spot.x, y: spot.y, w: spot.w, h: spot.h };
    cells.push(copy);
    selected = copy.id;
    render();
    syncPanel();
   }
  } else if (act === 'del') {
   const wasParent = c.kind === 'parent';
   cells = cells.filter(x => x.id !== c.id && x.parentId !== c.id);
   selected = null;
   if (wasParent) relayoutParentsToGrid();
   render();
   syncPanel();
   fitStage();
  }
 });

 function render() {
  paper.querySelectorAll('.cell').forEach(e => e.remove());
  const layer = c => c.kind === 'parent' ? (c.free ? 10 : 1) : c.kind === 'child' ? 20 : (c.type === 'textImage' ? 40 : 30);
  const sorted = [...cells].sort((a, b) => layer(a) - layer(b));

  for (const c of sorted) {
   const cls = c.kind === 'parent' ? (c.free ? 'parent free' : 'parent') : c.kind === 'child' ? 'child' : (c.type === 'textImage' ? 'text-image' : 'image-object');
   const el = document.createElement('div');
   el.className = 'cell ' + cls + (c.id === selected ? ' selected' : '');
   el.dataset.id = c.id;

   const parent = c.parentId ? cells.find(p => p.id === c.parentId) : null;
   let x = c.x, y = c.y;
   if (parent) { x += parent.x; y += parent.y; }

   el.style.left = x * mm + 'px';
   el.style.top = y * mm + 'px';
   el.style.width = c.w * mm + 'px';
   el.style.height = c.h * mm + 'px';
   el.style.background = c.type === 'textImage' ? 'transparent' : c.bg;
   el.style.zIndex = String(layer(c));

   const content = document.createElement('div');
   content.className = 'cell-content';
   content.style.fontSize = c.fontSize + 'px';
   content.style.color = c.textColor || '#111111';

   if (c.contentData) {
    const img = document.createElement('img');
    img.src = c.contentData;
    img.alt = c.text || '挿入画像';
    const rot = ((c.rotation || 0) % 360 + 360) % 360;
    if (rot % 180) {
     img.style.position = 'absolute';
     img.style.left = '50%';
     img.style.top = '50%';
     img.style.width = (c.h / c.w * 100) + '%';
     img.style.height = (c.w / c.h * 100) + '%';
     img.style.transform = 'translate(-50%,-50%) rotate(' + rot + 'deg)';
     img.style.objectFit = 'contain';
    } else if (rot) {
     img.style.transform = 'rotate(' + rot + 'deg)';
    }
    content.style.position = 'relative';
    content.appendChild(img);
   } else {
    content.textContent = c.text || (c.kind === 'child' ? '子マス' : (c.free ? '' : '親マス'));
   }
   el.appendChild(content);

   if (c.id === selected && (c.kind !== 'parent' || c.free)) {
    ['nw', 'ne', 'sw', 'se'].forEach(pos => {
     const h = document.createElement('i');
     h.className = 'handle ' + pos;
     h.dataset.handle = pos;
     el.appendChild(h);
    });
   }

   el.addEventListener('pointerdown', pointerDown);
   paper.appendChild(el);
  }
  gridBg.hidden = !$('gridView').checked;
  drawBorders();
  updateContextPopup();
 }

 function syncPanel() {
  const c = selectedCell();
  if (!c) { $('imageRotateControls').hidden = true; return; }
  const isImg = c.kind === 'image';
  const isParent = c.kind === 'parent';
  const isFree = !!c.free;
  $('imageRotateControls').hidden = !(isImg && !!c.contentData);
  $('textFieldWrap').hidden = isImg || isFree;
  $('fontSizeFieldWrap').hidden = isImg || isFree;
  $('w').readOnly = isParent && !isFree;
  $('h').readOnly = isParent && !isFree;
  $('editSheetTitle').textContent = (isFree ? 'フリーマス' : isParent ? '親マス' : c.kind === 'child' ? '子マス' : (c.type === 'textImage' ? '文字画像' : '画像')) + 'の編集';
  set('kindLabel', isFree ? 'フリーマス（自由配置）' : isParent ? '親マス（定位置グリッド・' + (c.format === 'assembly' ? '部品＋ボルト・ナット' : '部品単品') + '）' : c.kind === 'child' ? '子マス' : c.type === 'textImage' ? '文字画像' : '画像');
  set('w', Math.round(c.w));
  set('h', Math.round(c.h));
  set('bg', c.bg === 'transparent' ? '#ffffff' : c.bg);
  set('fontSize', c.fontSize);
  set('cellText', c.text || '');
  set('textColor', c.textColor || '#111111');
 }

 function updateFromPanel(e) {
  const c = selectedCell();
  if (!c) return;
  if (c.kind !== 'parent' || c.free) {
   const minSize = c.kind === 'child' ? 5 : 10;
   c.w = Math.max(minSize, +get('w') || minSize);
   c.h = Math.max(minSize, +get('h') || minSize);
  }
  if (c.bg !== 'transparent' || (e && e.target && e.target.id === 'bg')) c.bg = get('bg');
  c.fontSize = +get('fontSize') || 16;
  c.text = get('cellText');
  c.textColor = get('textColor');
  if (c.type === 'textImage') c.contentData = makeTextImage(c.text, c.textColor, c.fontSize, c.bg === 'transparent', c.textImageBg || '#ffffff');
  if (c.parentId) {
   const p = cells.find(p => p.id === c.parentId);
   if (p) {
    c.x = Math.max(0, Math.min(c.x, p.w - c.w));
    c.y = Math.max(0, Math.min(c.y, p.h - c.h));
   }
  }
  render();
 }

 /* ---- 指の管理：1本＝マス操作／スクロール、2本＝用紙の拡大縮小 ---- */
 const pointers = new Map();
 let pinch = null, pan = null;
 const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) || 1;

 function placeCellEl(c) {
  const el = paper.querySelector(`.cell[data-id="${c.id}"]`);
  if (!el) return;
  const parent = c.parentId ? cells.find(p => p.id === c.parentId) : null;
  el.style.left = (c.x + (parent ? parent.x : 0)) * mm + 'px';
  el.style.top = (c.y + (parent ? parent.y : 0)) * mm + 'px';
  el.style.width = c.w * mm + 'px';
  el.style.height = c.h * mm + 'px';
  drawBorders();
 }

 function cancelDrag() {
  if (!drag) return;
  const c = cells.find(x => x.id === drag.id);
  if (c) Object.assign(c, drag.orig);
  drag = null;
  render();
 }

 /* 指の中心点を動かさないまま倍率だけ変える */
 function zoomAt(s, mx, my) {
  s = Math.max(0.1, Math.min(3, s));
  const r = stageWrap.getBoundingClientRect();
  const px = (stageWrap.scrollLeft + mx - r.left - stageSizer.offsetLeft) / currentScale;
  const py = (stageWrap.scrollTop + my - r.top - stageSizer.offsetTop) / currentScale;
  const { rawW, rawH } = stagePixelDims();
  currentScale = s;
  stageSizer.style.width = rawW * s + 'px';
  stageSizer.style.height = rawH * s + 'px';
  stage.style.transform = 'scale(' + s + ')';
  stageWrap.scrollLeft = stageSizer.offsetLeft + px * s - (mx - r.left);
  stageWrap.scrollTop = stageSizer.offsetTop + py * s - (my - r.top);
 }

 function startPinch() {
  cancelDrag();
  pan = null;
  focusedParentId = null;
  const [a, b] = [...pointers.values()];
  pinch = { d0: dist(a, b), s0: currentScale };
  popup.hidden = true;
 }

 function tapSelect(id) {
  const c = cells.find(x => x.id === id);
  if (!c) return;
  const was = selected === id;
  selected = id;
  render();
  syncPanel();
  if (c.kind === 'parent' && (!was || focusedParentId !== id)) focusParentCell(c);
 }

 /* 子マス・画像：押したらすぐ選択してドラッグ開始 */
 function pointerDown(e) {
  if (pointers.size >= 2) return;
  const id = +e.currentTarget.dataset.id, c = cells.find(c => c.id === id);
  if (!c || (c.kind === 'parent' && !c.free)) return; /* 親マスは「タップ」で選択 */
  const changed = selected !== id;
  selected = id;
  drag = {
   id, pid: e.pointerId, handle: e.target.dataset.handle || null,
   scale: currentScale || 1,
   startX: e.clientX, startY: e.clientY,
   orig: { x: c.x, y: c.y, w: c.w, h: c.h },
   parent: c.parentId ? cells.find(p => p.id === c.parentId) : null
  };
  popup.hidden = true;
  if (changed) { render(); syncPanel(); }
  e.preventDefault();
  e.stopPropagation();
 }

 function pointerMove(e) {
  if (!drag) return;
  const c = cells.find(c => c.id === drag.id);
  if (!c) return;
  const dx = (e.clientX - drag.startX) / (mm * drag.scale);
  const dy = (e.clientY - drag.startY) / (mm * drag.scale);
  const o = drag.orig;

  if (!drag.handle) {
   c.x = snap(o.x + dx);
   c.y = snap(o.y + dy);
  } else {
   let x = o.x, y = o.y, w = o.w, h = o.h;
   const k = drag.handle;
   const minSize = c.kind === 'child' ? 5 : 10;
   if (k.includes('e')) w = Math.max(minSize, o.w + dx);
   if (k.includes('s')) h = Math.max(minSize, o.h + dy);
   if (k.includes('w')) { w = Math.max(minSize, o.w - dx); x = o.x + (o.w - w); }
   if (k.includes('n')) { h = Math.max(minSize, o.h - dy); y = o.y + (o.h - h); }
   if ($('lockRatio').checked) {
    const ratio = o.w / o.h;
    if (Math.abs(dx) > Math.abs(dy)) h = w / ratio; else w = h * ratio;
   }
   c.x = snap(x); c.y = snap(y); c.w = snap(w); c.h = snap(h);
  }
  if (drag.parent) {
   c.x = Math.max(0, Math.min(c.x, drag.parent.w - c.w));
   c.y = Math.max(0, Math.min(c.y, drag.parent.h - c.h));
  } else if (c.free) {
   const [pw, ph] = dims();
   c.x = Math.max(0, Math.min(c.x, pw - c.w));
   c.y = Math.max(0, Math.min(c.y, ph - c.h));
  }
  placeCellEl(c);
  if (c.free) descendants(c.id).forEach(placeCellEl); /* 動かしている間は対象マスの位置だけ更新（全再描画しない） */
 }

 function pointerUp() {
  const dc = drag ? cells.find(x => x.id === drag.id) : null;
  if (dc && dc.free) {
   /* 枠を小さくした時、中身が枠からはみ出さないよう収める */
   descendants(dc.id).forEach(ch => {
    ch.w = Math.min(ch.w, dc.w); ch.h = Math.min(ch.h, dc.h);
    ch.x = Math.max(0, Math.min(ch.x, dc.w - ch.w));
    ch.y = Math.max(0, Math.min(ch.y, dc.h - ch.h));
   });
  }
  drag = null;
  render();
  syncPanel();
 }

 /* 用紙エリアの指の動きを一括で見る（キャプチャ段階） */
 stageWrap.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { startPinch(); return; }
  if (pointers.size > 2) return;
  const t = e.target;
  if (t.closest && t.closest('input,select,button,label')) return;
  const cellEl = t.closest ? t.closest('.cell') : null;
  const c = cellEl ? cells.find(x => x.id === +cellEl.dataset.id) : null;
  if (c && (c.kind !== 'parent' || c.free)) return; /* 子マス・画像・フリーマスはドラッグ操作に任せる */
  const blank = !c && (t === paper || t === gridBg || t === stageWrap || t === stageSizer || t === stage);
  pan = { pid: e.pointerId, x0: e.clientX, y0: e.clientY, l0: stageWrap.scrollLeft, t0: stageWrap.scrollTop, moved: false, tapId: c ? c.id : null, blank };
 }, true);

 window.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size >= 2) {
   const [a, b] = [...pointers.values()];
   zoomAt(pinch.s0 * dist(a, b) / pinch.d0, (a.x + b.x) / 2, (a.y + b.y) / 2);
   return;
  }
  if (drag && e.pointerId === drag.pid) { pointerMove(e); return; }
  if (pan && e.pointerId === pan.pid) {
   const dx = e.clientX - pan.x0, dy = e.clientY - pan.y0;
   if (!pan.moved) {
    if (Math.hypot(dx, dy) < 8) return;
    pan.moved = true;
    popup.hidden = true;
   }
   stageWrap.scrollLeft = pan.l0 - dx;
   stageWrap.scrollTop = pan.t0 - dy;
  }
 });

 function onPointerEnd(e) {
  pointers.delete(e.pointerId);
  if (pinch) {
   if (pointers.size < 2) { pinch = null; updateContextPopup(); }
   return;
  }
  if (drag && e.pointerId === drag.pid) { pointerUp(); return; }
  if (pan && e.pointerId === pan.pid) {
   const p = pan;
   pan = null;
   if (p.moved) { updateContextPopup(); return; }
   if (e.type !== 'pointerup') return;
   if (p.tapId) tapSelect(p.tapId);
   else if (p.blank) { selected = null; render(); syncPanel(); fitStage(); }
  }
 }
 window.addEventListener('pointerup', onPointerEnd);
 window.addEventListener('pointercancel', onPointerEnd);
 window.addEventListener('blur', () => { pointers.clear(); pinch = null; pan = null; cancelDrag(); });
 ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

 function rotateSelectedImage(delta) {
  const c = selectedCell();
  if (!c || c.kind !== 'image' || !c.contentData) return;
  c.rotation = ((c.rotation || 0) + delta + 360) % 360;
  render();
  syncPanel();
 }

 function openTextImageDialog(c = null) {
  textImageEditId = c ? c.id : null;
  $('textImageValue').value = c ? (c.text || '') : '';
  $('textImageColor').value = c ? (c.textColor || '#111111') : '#111111';
  $('textImageSize').value = c ? (c.fontSize || 22) : 22;
  $('textImageClearBg').checked = !c || c.bg === 'transparent';
  $('textImageBg').value = c && c.textImageBg ? c.textImageBg : '#ffffff';
  $('textImageBgField').hidden = $('textImageClearBg').checked;
  $('textImageTitle').textContent = c ? '文字画像の編集' : '文字画像の作成';
  $('confirmTextImage').textContent = c ? '変更を反映' : '挿入';
  $('textImageDialog').hidden = false;
  $('textImageValue').focus();
 }

 $('addParent').onclick = () => { $('parentFormatDialog').hidden = false; };
 $('cancelParent').onclick = () => { $('parentFormatDialog').hidden = true; };
 $('confirmParent').onclick = () => {
  const fmt = get('parentFormat');
  $('parentFormatDialog').hidden = true;
  addParentTemplate(fmt);
 };

 fields.forEach(id => $(id).addEventListener('input', updateFromPanel));

 $('addFree').onclick = () => { addFreeCell(); };
 $('colorSetting').onclick = () => { applyPaperColor(); $('colorDialog').hidden = false; };
 $('colorOptions').addEventListener('click', e => {
  const b = e.target.closest('button[data-color]');
  if (!b) return;
  paperColorKey = b.dataset.color;
  applyPaperColor();
  $('colorDialog').hidden = true;
 });
 $('rotateLeft').onclick = () => rotateSelectedImage(-90);
 $('rotateRight').onclick = () => rotateSelectedImage(90);

 $('imageFile').onchange = e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const parent = targetParent();
  if (!parent) {
   alert('画像を配置する親マスを選択してから画像挿入してください。');
   e.target.value = '';
   return;
  }
  const reader = new FileReader();
  reader.onload = () => {
   /* 幅95×高さ70mm。親マスより大きい時は親マスに収める。下枠を0点として下に揃え、左右は中央 */
   const imgW = Math.min(95, parent.w);
   const imgH = Math.min(70, parent.h);
   const c = {
    id: nextId++, kind: 'image', parentId: parent.id,
    x: Math.round(((parent.w - imgW) / 2) * 10) / 10,
    y: Math.round((parent.h - imgH) * 10) / 10,
    w: imgW, h: imgH,
    text: file.name, contentData: reader.result, rotation: 0,
    bg: 'transparent', textColor: '#111111', fontSize: 22
   };
   cells.push(c);
   selected = c.id;
   render();
   syncPanel();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
 };

 $('textImageClearBg').onchange = () => { $('textImageBgField').hidden = $('textImageClearBg').checked; };
 $('cancelTextImage').onclick = () => { $('textImageDialog').hidden = true; textImageEditId = null; };
 $('confirmTextImage').onclick = () => {
  const value = get('textImageValue').trim();
  if (!value) { alert('文字を入力してください。'); return; }
  const color = get('textImageColor');
  const size = Math.max(8, Math.min(120, Number(get('textImageSize')) || 22));
  const clearBg = $('textImageClearBg').checked;
  const bg = clearBg ? null : get('textImageBg');
  const data = makeTextImage(value, color, size, clearBg, bg || '#ffffff');
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = `bold ${size}px sans-serif`;
  const imageW = Math.max(20, Math.ceil(measure.measureText(value).width + 24));
  const imageH = Math.max(30, Math.ceil(size * 1.8));

  if (textImageEditId !== null) {
   const c = cells.find(x => x.id === textImageEditId);
   if (c) {
    c.text = value; c.textColor = color; c.fontSize = size;
    c.bg = 'transparent';
    c.textImageBg = bg; c.contentData = data;
   }
   selected = textImageEditId;
  } else {
   const parent = targetParent();
   if (!parent) { alert('配置先の親マスを選択してください。'); return; }
   const spot = findEmptySpotInParent(parent, Math.max(30, imageW / mm), Math.max(15, imageH / mm));
   const c = {
    id: nextId++, kind: 'image', type: 'textImage', parentId: parent.id,
    x: spot.x, y: spot.y, w: spot.w, h: spot.h,
    text: value, contentData: data, rotation: 0,
    bg: 'transparent', textColor: color, fontSize: size, textImageBg: bg
   };
   cells.push(c);
   selected = c.id;
  }
  textImageEditId = null;
  $('textImageDialog').hidden = true;
  render();
  syncPanel();
 };

 $('resetZoom').onclick = () => { fitStage(); };
 $('openSettings').onclick = () => { $('settingsSheet').hidden = false; };
 document.querySelectorAll('.sheet-close').forEach(btn => {
  btn.onclick = () => { $(btn.dataset.close).hidden = true; };
 });
 document.querySelectorAll('.sheet-backdrop').forEach(bg => {
  bg.addEventListener('click', e => { if (e.target === bg) bg.hidden = true; });
 });

 $('paperSize').onchange = paperSetup;
 $('orientation').onchange = paperSetup;
 $('gridToggle').onchange = () => {
  $('status').textContent = $('gridToggle').checked ? '5mm単位の吸着を有効にしました。' : '自由配置にしました。';
 };
 $('gridView').onchange = () => { gridBg.hidden = !$('gridView').checked; };

 $('print').onclick = () => {
  const prevSelected = selected;
  selected = null;
  render();
  const [pw, ph] = dims();
  const contentBounds = cells.reduce((b, c) => {
   let x = c.x, y = c.y;
   if (c.parentId) { const p = cells.find(p => p.id === c.parentId); if (p) { x += p.x; y += p.y; } }
   return { x: Math.min(b.x, x), y: Math.min(b.y, y), r: Math.max(b.r, x + c.w), b: Math.max(b.b, y + c.h) };
  }, { x: 0, y: 0, r: 0, b: 0 });
  const scale = Math.min((pw - 16) / (contentBounds.r - contentBounds.x || 1), (ph - 16) / (contentBounds.b - contentBounds.y || 1), 1);
  if ($('fitPrint').checked) {
   stage.style.width = pw * mm + 'px';
   stage.style.height = ph * mm + 'px';
   paper.style.transformOrigin = 'top left';
   paper.style.transform = 'scale(' + scale + ')';
   paper.style.width = pw * mm + 'px';
   paper.style.height = ph * mm + 'px';
  }
  let restored = false;
  const restore = () => {
   if (restored) return;
   restored = true;
   window.removeEventListener('afterprint', restore);
   paper.style.transform = ''; paper.style.width = ''; paper.style.height = '';
   selected = prevSelected;
   render();
   if (focusedParentId) {
    const p = cells.find(x => x.id === focusedParentId);
    if (p) { focusParentCell(p); return; }
   }
   fitStage();
  };
  window.addEventListener('afterprint', restore);
  setTimeout(restore, 15000); /* afterprintが来ない環境の保険 */
  try {
   if (typeof window.print !== 'function') throw new Error('print機能なし');
   window.print();
  } catch (err) {
   showError('印刷画面を開けませんでした（' + (err && err.message ? err.message : err) + '）。Chrome / Safari で直接開き直してみてください。');
   restore();
  }
 };

 stageWrap.addEventListener('scroll', positionPopup, { passive: true });
 window.addEventListener('resize', () => {
  if (focusedParentId) {
   const p = cells.find(x => x.id === focusedParentId);
   if (p) { focusParentCell(p); return; }
  }
  fitStage();
 });

 if (!$('createdDate').value) {
  const today = new Date();
  $('createdDate').value = [today.getFullYear(), String(today.getMonth() + 1).padStart(2, '0'), String(today.getDate()).padStart(2, '0')].join('-');
 }
applyPaperColor();
 try {
  paperSetup();
 } catch (err) {
  showError(err && err.message ? err.message : String(err));
 }
 requestAnimationFrame(() => { if (!focusedParentId) fitStage(); });
 window.addEventListener('load', () => { if (!focusedParentId) fitStage(); });
 window.addEventListener('orientationchange', () => setTimeout(() => { if (!focusedParentId) fitStage(); }, 300));

 /* オフライン対応：Service Worker（https または localhost でのみ動作。それ以外では何もしない） */
 if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
   navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
  navigator.serviceWorker.addEventListener('message', ev => {
   if (ev.data === 'updated') {
    const u = document.getElementById('updateBanner');
    if (u) u.hidden = false;
   }
  });
 }
})();
</script>
</body>
</html>
